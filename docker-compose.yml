services:
  whatsapp-api:
    build: .
    container_name: whatsapp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_sessions:/usr/src/app/baileys_auth
    networks:
      - marketplaceapi-net
volumes:
  whatsapp_sessions:

networks:
  marketplaceapi-net:
    external: true
